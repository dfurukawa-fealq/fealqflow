services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: fealqflow-backend:latest
    container_name: fealqflow-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3333
      DATABASE_URL: ${DATABASE_URL:-file:/app/database/fealqflow.db}
    expose:
      - "3333"
    volumes:
      - ./database:/app/database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: fealqflow-frontend:latest
    container_name: fealqflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

